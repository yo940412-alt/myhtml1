<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>收支試算便條</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1f2328;--muted:#6b7280;--line:#e5e2da;--out:#b91c1c;--in:#15803d;--accent:#2f5d50;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--card:#1f2326;--text:#e8e8e6;--muted:#9aa0a6;--line:#31373b;--out:#f87171;--in:#4ade80;--accent:#6fb59f}}
:root[data-theme="dark"]{--bg:#15181a;--card:#1f2326;--text:#e8e8e6;--muted:#9aa0a6;--line:#31373b;--out:#f87171;--in:#4ade80;--accent:#6fb59f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:transparent;color:var(--muted);border:1px solid var(--line);font-size:14px;padding:9px 4px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
textarea{min-height:140px;resize:vertical}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--muted);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.msg{font-size:13px;color:var(--muted);margin-top:8px;white-space:pre-line}
.editing{font-size:13px;color:var(--accent);margin-top:8px}
.total{text-align:center}
.total small{color:var(--muted)}
.total .n{font-size:34px;font-weight:700}
.total .n.out{color:var(--out)}
.total .n.in{color:var(--in)}
.item{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item span{flex:1;word-break:break-all}
.item em{font-style:normal;font-weight:600}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px 0}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.note{background:#fff3a8;color:#3a3200;border-radius:4px 4px 14px 4px;padding:12px 14px;box-shadow:0 3px 8px rgba(0,0,0,.18);position:relative;cursor:pointer}
.note.income{background:#d6f0d0;color:#153a12}
.note .tag{position:absolute;top:8px;right:30px;font-size:11px;opacity:.7}
.note h3{margin:0 50px 6px 0;font-size:15px;word-break:break-all}
.note .l{display:flex;gap:6px;font-size:14px;padding:2px 0;border-top:1px dashed rgba(0,0,0,.2)}
.note .l:first-of-type{border-top:0}
.note .l span{flex:1;word-break:break-all}
.note .t{margin-top:8px;padding-top:6px;border-top:2px solid rgba(0,0,0,.35);display:flex;justify-content:space-between;font-weight:700}
.note .x{position:absolute;top:6px;right:6px;background:none;color:inherit;opacity:.6;padding:2px 8px;font-size:16px}
.hint{font-size:11px;color:var(--muted);text-align:center;margin:-4px 0 10px}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:8px 4px 20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>收支試算便條</h1>
<div class="tabs">
  <button id="tabE" class="on">支出試算</button>
  <button id="tabI">收入試算</button>
  <button id="tabN">便條列表（<span id="nc">0</span>）</button>
</div>

<section id="pageE"></section>
<section id="pageI" hidden></section>
<section id="pageN" hidden>
  <p class="hint">點便條可讀取回對應試算頁重新編輯，點 ✕ 刪除。</p>
  <div class="notes" id="notes"></div>
</section>

<p class="foot">便條只儲存在你這台裝置的瀏覽器，不會上傳，也不會被其他人看到。</p>
</main>

<script>
var KEY = "expense-notes-v2";
var notes = [];
var $ = function (id) { return document.getElementById(id); };
function fmt(n) { return (Math.round(n * 100) / 100).toLocaleString("zh-TW"); }

function loadNotes() { try { notes = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { notes = []; } }
function saveNotes() {
  try { localStorage.setItem(KEY, JSON.stringify(notes)); return true; }
  catch (e) { return false; }
}

// ---- 共用的一個試算頁（支出/收入各一份狀態） ----
function makeCalc(type, label, signed) {
  var box, ttl, msg, sum, cnt, list, saveBtn, clrBtn, editTag;
  var cur = { items: [], total: 0 };
  var editingId = null;

  var root = document.getElementById(type === "expense" ? "pageE" : "pageI");
  root.innerHTML =
    '<div class="card">' +
      '<textarea placeholder="每行一筆，格式：項目:金額' + (signed ? "&#10;薪水:50000&#10;退款:-200" : "&#10;房租:12000&#10;午餐 便當:120") + '&#10;可直接貼上多行"></textarea>' +
      '<div class="msg"></div>' +
    '</div>' +
    '<div class="card total">' +
      '<small>' + label + '總計</small>' +
      '<div class="n ' + (type === "expense" ? "out" : "in") + '">0</div>' +
      '<small class="cnt"></small>' +
      '<div class="list" style="text-align:left;margin-top:10px"></div>' +
    '</div>' +
    '<div class="card">' +
      '<input type="text" class="ttl" placeholder="便條標題（選填）" maxlength="40">' +
      '<div class="editing" hidden>目前正在編輯已儲存的便條</div>' +
      '<div class="row">' +
        '<button class="g clr">清除</button>' +
        '<button class="save" disabled>儲存</button>' +
      '</div>' +
    '</div>';

  box = root.querySelector("textarea");
  ttl = root.querySelector(".ttl");
  msg = root.querySelector(".msg");
  sum = root.querySelector(".n");
  cnt = root.querySelector(".cnt");
  list = root.querySelector(".list");
  saveBtn = root.querySelector(".save");
  clrBtn = root.querySelector(".clr");
  editTag = root.querySelector(".editing");

  function calc() {
    var lines = box.value.replace(/\uFF1A/g, ":").split(/\r?\n/);
    var items = [], errs = [], total = 0;
    lines.forEach(function (raw, i) {
      var line = raw.trim();
      if (!line) return;
      var p = line.lastIndexOf(":");
      var name = p < 0 ? "" : line.slice(0, p).trim();
      var num = p < 0 ? "" : line.slice(p + 1).trim().replace(/,/g, "");
      if (!name || !/^[+-]?\d+(\.\d+)?$/.test(num)) { errs.push("第 " + (i + 1) + " 行格式錯誤，已略過：" + line); return; }
      var amt = parseFloat(num);
      if (!signed) amt = Math.abs(amt);
      items.push({ name: name, amt: amt });
      total += amt;
    });
    cur = { items: items, total: total };
    sum.textContent = fmt(total);
    sum.className = "n " + (total < 0 ? "out" : (type === "expense" ? "out" : "in"));
    cnt.textContent = items.length ? "共 " + items.length + " 筆" : "";
    msg.textContent = errs.join("\n");
    saveBtn.disabled = !items.length;
    list.innerHTML = "";
    items.forEach(function (r) {
      var d = document.createElement("div"); d.className = "item";
      var s = document.createElement("span"); s.textContent = r.name;
      var e = document.createElement("em"); e.textContent = (signed && r.amt > 0 ? "+" : "") + fmt(r.amt);
      if (signed) e.style.color = r.amt < 0 ? "var(--out)" : "var(--in)";
      d.appendChild(s); d.appendChild(e); list.appendChild(d);
    });
  }

  function resetEdit() {
    editingId = null; editTag.hidden = true; saveBtn.textContent = "儲存";
  }

  box.oninput = calc;
  clrBtn.onclick = function () { box.value = ""; ttl.value = ""; resetEdit(); calc(); };

  saveBtn.onclick = function () {
    if (!cur.items.length) return;
    if (editingId) {
      var n = notes.find(function (k) { return k.id === editingId; });
      if (n) { n.title = ttl.value.trim(); n.items = cur.items; n.total = cur.total; }
    } else {
      notes.unshift({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), type: type, title: ttl.value.trim(), items: cur.items, total: cur.total });
    }
    if (!saveNotes()) { msg.textContent = "無法儲存到瀏覽器（可能是無痕模式）。"; return; }
    box.value = ""; ttl.value = ""; resetEdit(); calc();
    msg.textContent = "已儲存到便條列表。";
    renderNotes();
  };

  calc();

  return {
    loadNote: function (n) {
      box.value = n.items.map(function (r) { return r.name + ":" + ((signed && r.amt > 0) ? "+" : "") + r.amt; }).join("\n");
      ttl.value = n.title || "";
      editingId = n.id; editTag.hidden = false; saveBtn.textContent = "更新便條";
      calc();
    }
  };
}

var calcE, calcI;

function renderNotes() {
  $("nc").textContent = notes.length;
  var el = $("notes"); el.innerHTML = "";
  if (!notes.length) { el.innerHTML = '<div class="empty" style="grid-column:1/-1">還沒有便條，試算後按「儲存」就會出現在這裡。</div>'; return; }
  notes.forEach(function (n) {
    var d = document.createElement("div"); d.className = "note" + (n.type === "income" ? " income" : "");
    var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = n.type === "income" ? "收入" : "支出"; d.appendChild(tag);
    var h = document.createElement("h3"); h.textContent = n.title || (n.type === "income" ? "收入便條" : "支出便條"); d.appendChild(h);
    n.items.forEach(function (r) {
      var l = document.createElement("div"); l.className = "l";
      var s = document.createElement("span"); s.textContent = r.name;
      var e = document.createElement("b"); e.textContent = (n.type === "income" && r.amt > 0 ? "+" : "") + fmt(r.amt);
      l.appendChild(s); l.appendChild(e); d.appendChild(l);
    });
    var t = document.createElement("div"); t.className = "t";
    var a = document.createElement("span"); a.textContent = "總計";
    var b = document.createElement("span"); b.textContent = (n.type === "income" && n.total > 0 ? "+" : "") + fmt(n.total);
    t.appendChild(a); t.appendChild(b); d.appendChild(t);
    var x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", "刪除便條");
    x.onclick = function (ev) { ev.stopPropagation(); notes = notes.filter(function (k) { return k.id !== n.id; }); saveNotes(); renderNotes(); };
    d.appendChild(x);
    d.onclick = function () {
      if (n.type === "income") { tab("I"); calcI.loadNote(n); } else { tab("E"); calcE.loadNote(n); }
    };
    el.appendChild(d);
  });
}

function tab(which) {
  $("pageE").hidden = which !== "E"; $("pageI").hidden = which !== "I"; $("pageN").hidden = which !== "N";
  $("tabE").className = which === "E" ? "on" : "";
  $("tabI").className = which === "I" ? "on" : "";
  $("tabN").className = which === "N" ? "on" : "";
  if (which === "N") renderNotes();
}

$("tabE").onclick = function () { tab("E"); };
$("tabI").onclick = function () { tab("I"); };
$("tabN").onclick = function () { tab("N"); };

loadNotes();
calcE = makeCalc("expense", "支出", false);
calcI = makeCalc("income", "收入", true);
renderNotes();
</script>
</body>
</html>
